name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install rich build

      - name: Test
        working-directory: python
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Build wheel + sdist
        working-directory: python
        run: python -m build

      - name: Build single-file zipapp
        run: |
          rm -rf build/zipapp
          mkdir -p build/zipapp
          python -m pip install --quiet --target build/zipapp rich
          cp -r python/hyprtk_usb build/zipapp/
          printf 'import sys\nfrom hyprtk_usb.cli import main\nsys.exit(main())\n' > build/zipapp/__main__.py
          python -m zipapp build/zipapp -o hyprtk-usb.pyz -p "/usr/bin/env python3"
          sha256sum hyprtk-usb.pyz > hyprtk-usb.pyz.sha256

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp python/dist/* out/
          cp hyprtk-usb.pyz hyprtk-usb.pyz.sha256 out/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
